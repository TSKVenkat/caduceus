<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#222">LLMLingua standalone text compression</text>
  <text x="40" y="62" font-size="13" fill="#666">Compressing the project README at a target keep-rate of 0.5</text>

  <!-- axis -->
  <line x1="120" y1="100" x2="120" y2="320" stroke="#bbb" stroke-width="1"/>
  <line x1="120" y1="320" x2="600" y2="320" stroke="#bbb" stroke-width="1"/>

  <text x="110" y="105" font-size="11" fill="#999" text-anchor="end">765</text>
  <line x1="120" y1="100" x2="600" y2="100" stroke="#eee" stroke-width="1"/>
  <text x="110" y="216" font-size="11" fill="#999" text-anchor="end">383</text>
  <line x1="120" y1="211" x2="600" y2="211" stroke="#eee" stroke-width="1"/>

  <!-- bar: original (765 -> 220px) -->
  <rect x="200" y="100" width="120" height="220" fill="#adb5bd"/>
  <text x="260" y="92" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">765</text>
  <text x="260" y="340" font-size="13" fill="#333" text-anchor="middle">original tokens</text>

  <!-- bar: compressed (367 -> 105.6px, top at 320-105.6=214.4) -->
  <rect x="400" y="214" width="120" height="106" fill="#4c6ef5"/>
  <text x="460" y="206" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">367</text>
  <text x="460" y="340" font-size="13" fill="#333" text-anchor="middle">compressed tokens</text>

  <text x="320" y="370" font-size="13" fill="#2b8a3e" text-anchor="middle">52% fewer tokens</text>
</svg>
