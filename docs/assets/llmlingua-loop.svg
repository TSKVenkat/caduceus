<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Helvetica, Arial, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="bold" fill="#222">LLMLingua compression of tool output in the agent loop</text>
  <text x="40" y="62" font-size="13" fill="#666">Total model tokens for one task: read a 40-paragraph note and report a single planted fact</text>

  <!-- axis -->
  <line x1="120" y1="100" x2="120" y2="320" stroke="#bbb" stroke-width="1"/>
  <line x1="120" y1="320" x2="600" y2="320" stroke="#bbb" stroke-width="1"/>

  <!-- gridline values -->
  <text x="110" y="105" font-size="11" fill="#999" text-anchor="end">4035</text>
  <line x1="120" y1="100" x2="600" y2="100" stroke="#eee" stroke-width="1"/>
  <text x="110" y="215" font-size="11" fill="#999" text-anchor="end">2000</text>
  <line x1="120" y1="211" x2="600" y2="211" stroke="#eee" stroke-width="1"/>

  <!-- bar: without compression (4035 -> 220px) -->
  <rect x="200" y="100" width="120" height="220" fill="#adb5bd"/>
  <text x="260" y="92" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4035</text>
  <text x="260" y="340" font-size="13" fill="#333" text-anchor="middle">without compression</text>

  <!-- bar: with LLMLingua (2727 -> 148.7px, top at 320-148.7=171.3) -->
  <rect x="400" y="171" width="120" height="149" fill="#4c6ef5"/>
  <text x="460" y="163" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2727</text>
  <text x="460" y="340" font-size="13" fill="#333" text-anchor="middle">with LLMLingua</text>

  <!-- reduction callout -->
  <text x="320" y="370" font-size="13" fill="#2b8a3e" text-anchor="middle">32% fewer model tokens; planted fact preserved</text>
</svg>
